name: nf-meta
channels:
  - conda-forge
  - bioconda

# ============================================================================
# 单环境策略 —— V1 全部工具共存于此
#
# 本环境刻意容纳 V1 范围内的**全部**工具 (预处理 / read-based / 组装 /
# 分箱 / MAG 质控 / 分类 / 去冗余 / 基因预测 / 注释 / 丰度 / 报告),
# 使 `-profile standard` 的本地开发与调试无需切换环境。
#
# ---------------------------------------------------------------------------
# 为什么是 python 3.12 —— 这是唯一可行的交点, 不是随手选的
# ---------------------------------------------------------------------------
#   quast 5.3.0    仅提供 py38 / py39 / py312 / py313 四种 build (无 310/311)
#   humann 3.9     是 py312 专属 build (3.8 及以下才是 noarch)
#   checkm2 1.1.0  build _1 要求 python >3.12; build _0 要求 python <3.9
#                  (且 _0 会把 numpy 钉到 1.19 / tensorflow <2.6, 不可接受)
#   gtdbtk 2.7.2   要求 python <3.14
#
# 四条约束的交集只剩 3.12.x。选 3.13 亦可解, 但 humann 会退回 3.8 —— 因此 3.12 更优。
#
# ---------------------------------------------------------------------------
# 为共存付出的代价 —— 每一条都是被硬依赖逼出来的, 降级前请先读这里
# ---------------------------------------------------------------------------
#   multiqc 1.21        gtdbtk 全系列要求 pydantic >=1.9.2,<2, 而 multiqc >=1.22
#                       要求 pydantic >=2.7.1 —— 二者不可兼得。1.21 是 pydantic v1
#                       时代的最后一版, 对 fastqc/fastp/bowtie2/quast/kraken2/
#                       samtools 的解析模块齐全, 够用。
#                       ⚠ 若不锁 gtdbtk, 求解器会反向把 gtdbtk 降到 1.7.0 (2021 年,
#                         只认 GTDB R202 老库) 来保住 multiqc 1.35 —— 那是更坏的结果,
#                         且不会报错。故 gtdbtk 必须显式锁版本。
#   rich 13.9.4         multiqc 1.21 用 rich.panel, rich 15 已移除该模块
#                       (AttributeError, Phase 15 实测)。1.21 对 rich 只有下界
#                       无上界, 求解器会拉到 15 —— 故必须显式钉 13.9.4。
#                       QUAST 另一坑 (report.tsv 无基因预测时 predicted genes
#                       行为 "-", multiqc quast 模块做字符串减法崩溃) 在
#                       MULTIQC process 内清洗暂存副本解决, 不涉及环境。
#
#   samtools 1.22.1     rgi 6.0.8 硬钉 `samtools 1.22.1.*`
#   diamond 2.1.11      checkm2 1.1.0 build _1 硬钉 `diamond 2.1.11.*`
#   eggnog-mapper       2.1.13+ 同时要求 python <3.12 且 diamond <2.1, 两条都撞车;
#     2.1.12            且 2.1.12 仅 build _0 无 python 上界, 求解时会自动选中它。
#   numpy 1.26          checkm2 引入的 tensorflow 2.17 要求 numpy <2
#
#   dask >=2025         ⚠ 必须显式提版本, 否则默认解出 dask 2023.3.0 (早于
#                       python 3.12 发布), 其 dataframe/accessor.py 的
#                       _bind_property 撞上 3.12 改动过的 inspect, 抛
#                       "TypeError: descriptor '__call__' ... property object"。
#                       后果: rgi 直接 import dask.dataframe 而崩溃; checkm2
#                       经 lightgbm/compat.py -> dask 同样崩溃。两者都是**装得上、
#                       跑不了**。rgi 只声明了裸 `dask` 无版本约束, 而求解器偏好
#                       包更少的旧版本 (新 dask 会拖入 pyarrow/distributed), 故
#                       必须在此显式提上来。
#
#   pandas 不锁         曾怀疑是 pandas 3.0 导致上述崩溃, 实测否定: 降到 2.3.3
#                       仍崩, 升回 3.0.5 配新 dask 则正常。故不加多余的 pin。
#
# ---------------------------------------------------------------------------
# ⚠ 本文件不足以产出可用环境 —— 必须走 setup_env.sh
# ---------------------------------------------------------------------------
# 有两类问题 conda 求解层面表达不了, 只能在安装后修复, 已封装进 setup_env.sh:
#
#   1. humann 的 conda 包自带 bin/bowtie2* 与 bin/diamond 副本, 安装时**覆盖**
#      同名独立包, 把 bowtie2 压到 2.2.3 (2014 年版)、diamond 压到 2.0.15。
#      仅有一条 libmamba warning, 不报错。
#   2. eggnog-mapper 2.1.12 build _0 到包内目录 (site-packages/eggnogmapper/bin/)
#      找可执行文件, 而该目录是空的, 导致 emapper 报 "Diamond was not found"。
#
# 因此正确的建环境方式是:
#     bash setup_env.sh          # 创建 + 修复 + 逐个验证工具可启动
# 而不是直接 `mamba env create -f environment.yml`。
#
# ---------------------------------------------------------------------------
# 全部精确锁版本 —— 这不是洁癖
# ---------------------------------------------------------------------------
# 本环境曾因无约束的增量 `mamba install` 而静默损坏: 后续安装 humann 时,
# conda 会隐式锁定已装 python 的次版本, 求解器为了在该 python 上找到可行解,
# 把 samtools 一路降到 0.1.19 (2013 年, sort 子命令语法完全不同, 直接
# 使 HOST_REMOVAL 失败)、fastp 降到 1.1.0、metaphlan 降到 3.0 且 import 崩溃。
# 全程无任何报错。
#
# 因此: **永远用 `mamba env create -f environment.yml` 从头重建, 不要
# 往已有环境里 `mamba install` 追加包。** 需要新工具时改本文件后重建。
#
# ---------------------------------------------------------------------------
# 数据库不随环境安装
# ---------------------------------------------------------------------------
# Kraken2 标准库 ~70 GB, HUMAnN (ChocoPhlAn+UniRef) ~30 GB, GTDB-Tk ~110 GB,
# CheckM2 ~3 GB, eggNOG ~50 GB, CARD ~"小"。均需自行准备并通过
# --kraken2_db / --humann_db / --gtdbtk_db / --checkm2_db / --eggnog_db /
# --card_db 等参数传入。
#
# ---------------------------------------------------------------------------
# 与各 process 的 conda/container 指令的关系
# ---------------------------------------------------------------------------
# 各 module 仍各自声明 conda/container (供 -profile conda|docker|singularity),
# 那条路径下每个 process 独立建环境, 不受本文件的共存妥协约束 —— 因而模块里
# 可以是 samtools=1.24 / multiqc=1.35 等更新的版本。本文件的降级只作用于
# `-profile standard`。二者版本不一致是预期行为, 不是 bug。
# ============================================================================

dependencies:
  # ---- 运行时 ----
  - python=3.12
  - nextflow=26.04.4         # Phase 17 对齐: 本项目全部验证 (Phase 1-17) 实际经
                             # ~/.local/bin 的 26.04.4 运行; 26.04.6 从未被真实
                             # 执行过。钉实际验证过的版本 (补丁级差异)。
  - openjdk=21
  - dask>=2025                # 必须显式提版本, 原因见上; 关系到 rgi/checkm2 能否启动

  # ---- 基础开发工具 ----
  - git
  - make
  - curl
  - wget
  - tree
  - jq

  # ---- Phase 3 预处理 ----
  - fastqc=0.12.1
  - fastp=1.3.6
  - bowtie2=2.5.5
  - samtools=1.22.1           # 降级原因见上: rgi 6.0.8 硬钉

  # ---- Phase 4 read-based 分析 ----
  - kraken2=2.17.1
  - bracken=3.1               # 注意: `bracken -v` 自报 3.0.1 (上游未更新版本字符串)
  - humann=3.9                # py312 专属 build; 自动引入 metaphlan 4.2.6
  - metaphlan=4.2.6           # 显式锁定, 防止求解器回落到崩溃的 3.0

  # ---- Phase 5 组装 ----
  - megahit=1.2.9
  - spades=4.3.0              # metaSPAdes 由 spades 包提供
  - quast=5.3.0

  # ---- Phase 6-7 分箱与 MAG 质控 ----
  - metabat2=2.18
  - checkm2=1.1.0             # 引入 tensorflow 2.17 (CPU) + 钉死 diamond 2.1.11

  # ---- Phase 8-9 MAG 分类与去冗余 ----
  - gtdbtk=2.7.2              # 必须显式锁定, 否则会被静默降到 1.7.0, 见上
  - drep=3.7.1                # 引入 checkm-genome / mash / mummer4 / skani

  # ---- Phase 10-11 基因预测与注释 ----
  - prodigal=2.6.3
  - diamond=2.1.11            # 降级原因见上: checkm2 硬钉
  - eggnog-mapper=2.1.12      # 上限原因见上
  - rgi=6.0.8                 # 引入 blast 2.16.0 / kma / bamtools / oligoarrayaux

  # ---- Phase 12 丰度 ----
  - coverm=0.8.0

  # ---- 报告 ----
  - multiqc=1.21              # 降级原因见上: gtdbtk 的 pydantic <2
  - rich=13.9.4               # multiqc 1.21 需要 rich.panel (rich 15 已移除), 见上

  # ---- Phase 21 结果可视化 ----
  - matplotlib=3.10.9         # 画图脚本 bin/plot_results.py (Agg backend);
                             # numpy 见下 (checkm2 的 tensorflow 已钉 numpy<2,
                             # matplotlib 3.10.x 与 numpy 1.26 / py3.12 兼容)
  - numpy=1.26                # 直接依赖 (PCoA 特征分解); checkm2 传递钉 1.26,
                             # 此处显式声明画图脚本的直接依赖
